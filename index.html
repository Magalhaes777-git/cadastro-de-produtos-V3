<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de estoque - POO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>
            <h1>Cadastro de produtos</h1>

            <form action="" id="produto-form">
                <div class="form-group">
                    <label for="nome">Nome do produto:</label>
                    <input type="text" id="nome" placeholder="Ex. Notebook" required />
                </div>

                <div class="form-group">
                    <label for="nome">Preço (R$)</label>
                    <input type="number" id="preco" step="0.01" placeholder="3500.00" required />
                </div>

                <div class="form-group">
                    <label for="nome">quantidade</label>
                    <input type="number" id="quantidade" step="1" placeholder="5" required />
                </div>

                <button type="submit" class="btn-primary">adicionar produto</button>
            </form>

            <div class="resumo-container">
                <h3 id="total-estoque">Total em estoque: R$0,00</h3>
                <button id="limpar-tabela" class="btn-danger">limpar tudo</button>
            </div>
            <table id="tabela-produtos">
                <thead>
                    <tr>
                        <th>nome</th>
                        <th>preço Un.</th>
                        <th>quantidade</th>
                        <th>subtotal</th>
                        <th>ações</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
    </div>

    <script src="script.js"></script>

</body>
</html>
